<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bất ngờ dành cho bạn ✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Hiệu ứng nhịp đập */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pulse-anim {
            animation: pulse 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="relative">

    <!-- BƯỚC 1: TRANG TRẮNG CÓ NÚT "BẤM VÀO ĐÂY" -->
    <div id="step-1" class="text-center">
        <button onclick="showQuestion()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-full shadow-lg text-xl transition duration-200 pulse-anim cursor-pointer">
            Bấm vào đây 👇
        </button>
    </div>

    <!-- BƯỚC 2: CÂU HỎI VÀ NÚT TỪ CHỐI CHẠY TRỐN -->
    <div id="step-2" class="hidden relative z-10 bg-slate-900/90 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl max-w-lg w-full mx-4 text-center border border-slate-700">
        <div class="text-6xl mb-4">
            💸
        </div>

        <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-8 leading-relaxed">
            Liệu bạn có cho Quang 500k không? 🥺
        </h1>

        <div id="btn-container" class="flex items-center justify-center gap-6 min-h-[60px] relative">
            <!-- Nút Đồng Ý -->
            <button onclick="acceptMoney()" class="bg-gradient-to-r from-emerald-500 to-green-600 text-white font-black py-3 px-8 rounded-full text-lg shadow-lg hover:scale-110 transition duration-200 z-20">
                Đồng ý ❤️
            </button>

            <!-- Nút Không (Luôn hiện rõ, khi đụng vào mới chạy trốn) -->
            <button id="btn-no" onmouseover="dodgeButton()" ontouchstart="dodgeButton()" class="bg-rose-500 text-white font-bold py-3 px-6 rounded-full text-lg shadow-lg transition-all duration-150 z-30">
                Không 😜
            </button>
        </div>
    </div>

    <!-- BƯỚC 3: THÔNG BÁO KHI ĐỒNG Ý -->
    <div id="step-3" class="hidden relative z-10 bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center border border-emerald-200">
        <div class="text-6xl mb-4">
            🎉🥰
        </div>
        <h2 class="text-2xl font-black text-emerald-600 mb-2">
            Cảm ơn bạn nhiều nha!
        </h2>
        <p class="text-gray-700 font-semibold mb-6">
            Quang đã nhận 500k rồi nhé! Uy tín luôn ❤️
        </p>
        <button onclick="location.reload()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-6 rounded-full shadow transition">
            Bấm để chơi lại 🔄
        </button>
    </div>

    <script>
        // Hiển thị giao diện câu hỏi khi bấm vào nút ban đầu
        function showQuestion() {
            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
            document.body.style.backgroundColor = '#0f172a'; // Đổi nền sang màu tối lung linh
        }

        // Hàm khiến nút "Không" tự dịch chuyển chạy trốn
        function dodgeButton() {
            const btnNo = document.getElementById('btn-no');
            
            // Tính toán khoảng cách tối đa trong màn hình
            const maxX = window.innerWidth - btnNo.offsetWidth - 40;
            const maxY = window.innerHeight - btnNo.offsetHeight - 40;

            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            // Chuyển sang fixed khi bắt đầu chạy trốn
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Khi bấm nút "Đồng ý"
        function acceptMoney() {
            // Bắn pháo hoa ăn mừng
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });

            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-3').classList.remove('hidden');
        }
    </script>
</body>
</html>
